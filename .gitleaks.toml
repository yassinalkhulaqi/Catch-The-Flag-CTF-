[rules]
# Catch The Flag — gitleaks secret scanning ruleset
# Block common secret leaks across the whole repo.

[[rules]]
id = "generic-api-key"
description = "Generic API key pattern"
regex = '(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token|auth[_-]?token)[\s]*[:=][\s]*["\']?([A-Za-z0-9_\-]{16,})["\']?'
secretGroup = 2

[[rules]]
id = "aws-access-key"
description = "AWS access key id"
regex = '(?i)AKIA[0-9A-Z]{16}'
secretGroup = 0

[[rules]]
id = "aws-secret-key"
description = "AWS secret access key"
regex = '(?i)(aws[_-]?secret[_-]?access[_-]?key|aws_secret_access_key)[\s]*[:=][\s]*["\']?([A-Za-z0-9/+=]{40})["\']?'
secretGroup = 2

[[rules]]
id = "private-key"
description = "Private key block"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'
secretGroup = 0

[[rules]]
id = "jwt"
description = "JWT token"
regex = '(?i)(jwt|access_token|id_token)[\s]*[:=][\s]*["\']?([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)["\']?'
secretGroup = 2

[[rules]]
id = "github-token"
description = "GitHub personal access token"
regex = '(?i)ghp_[A-Za-z0-9]{36,}'
secretGroup = 0

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '(?i)(xox[bapr]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{32,})'
secretGroup = 0

[[rules]]
id = "sendgrid-key"
description = "SendGrid API key"
regex = '(?i)SG\.[A-Za-z0-9_-]{22,}\.[A-Za-z0-9_-]{22,}'
secretGroup = 0

[[rules]]
id = "stripe-key"
description = "Stripe test/live key"
regex = '(?i)(sk|pk)_(test|live)_[0-9a-zA-Z]{24,}'
secretGroup = 0

[[rules]]
id = "mailgun-key"
description = "Mailgun API key"
regex = '(?i)key-[0-9a-zA-Z]{32,}'
secretGroup = 0

[paths]
# Exclude dependency/vendor directories and lock files from scanning
exclude = [
  '.git/',
  'vendor/',
  'node_modules/',
  'composer.lock',
  'package-lock.json',
  '.next/',
  'storage/',
  'bootstrap/cache/',
]
