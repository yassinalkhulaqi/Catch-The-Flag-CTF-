name: CI

on:
  push:
    branches: [main, 'cursor/**', 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHPUnit + Pint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catch_the_flag_test
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf_secret_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d catch_the_flag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, mbstring, xml, curl, zip, bcmath, intl, gd
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=catch_the_flag_test/' .env
      - name: Pint (dirty check)
        run: vendor/bin/pint --test
      - name: Migrate + test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: catch_the_flag_test
          DB_USERNAME: ctf
          DB_PASSWORD: ctf_secret_local_only
        run: |
          php artisan migrate --force
          php artisan test --compact
      - name: Composer audit (fail on high/critical)
        run: composer audit
      - name: Semgrep SAST (PHP)
        uses: returntocorp/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          config: >-
            p/laravel
            p/php
          json: true

  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: npm audit (fail on high/critical)
        run: npm audit
      - name: Semgrep SAST (TypeScript/Next.js)
        uses: returntocorp/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          config: >-
            p/nextjs
            p/typescript
          json: true
      - run: npm run build
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  security-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
        with:
          config: .gitleaks.toml
          args: --report-format json --report-path gitleaks-report.json --verbose
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  playwright:
    name: Playwright smoke test
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catch_the_flag_test
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf_secret_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d catch_the_flag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, mbstring, xml, curl, zip, bcmath, intl, gd
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=catch_the_flag_test/' .env
      - name: Migrate + seed
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: catch_the_flag_test
          DB_USERNAME: ctf
          DB_PASSWORD: ctf_secret_local_only
        working-directory: apps/api
        run: |
          php artisan migrate --force --seed
      - name: Start API server
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: catch_the_flag_test
          DB_USERNAME: ctf
          DB_PASSWORD: ctf_secret_local_only
        working-directory: apps/api
        run: nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &
        shell: bash
      - name: Start web dev server
        working-directory: apps/web
        run: nohup npm run dev > /tmp/web.log 2>&1 &
        shell: bash
      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1 && echo "API up" && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null 2>&1 && echo "Web up" && break
            sleep 1
          done
      - name: Run Playwright smoke tests
        working-directory: apps/web
        run: npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  lighthouse:
    name: Lighthouse CI budgets
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Install Lighthouse CI
        run: npm install --save-dev @lhci/cli@0.14.x
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=.lighthouserc.json
        working-directory: apps/web
        env:
          LHCI_BUILD_CONTEXT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
